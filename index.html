<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --bg:#EDEADD;
    --surface:#FFFFFF;
    --surface-2:#F6F1E3;
    --surface-3:#EFE8D4;
    --ink:#201C13;
    --ink-soft:#5C5645;
    --ink-faint:#9A927A;
    --line:#DAD3BC;
    --line-strong:#C7BE9F;
    --accent:#A9762C;
    --on-accent:#FBF7EC;
    --on-accent-soft:rgba(251,247,236,.76);
    --shadow: 0 1px 2px rgba(32,28,19,.06), 0 10px 24px -12px rgba(32,28,19,.22);

    --u1:#B8402A; --u2:#2B5C82; --u3:#1D7566; --u4:#6F3A66; --u5:#4B7A38;
    --u6:#9C6B22; --u7:#C4632A; --u8:#21748A; --u9:#99315F;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15130E;
      --surface:#211D16;
      --surface-2:#28241B;
      --surface-3:#312B1F;
      --ink:#F3EFE2;
      --ink-soft:#B7AF9B;
      --ink-faint:#7C7461;
      --line:#3B3527;
      --line-strong:#4B4430;
      --accent:#D4A24C;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 16px 32px -16px rgba(0,0,0,.55);

      --u1:#E0684C; --u2:#5B93C2; --u3:#3FAE99; --u4:#A868A0; --u5:#82B665;
      --u6:#D9A248; --u7:#EE8F52; --u8:#55AFC4; --u9:#D06592;
    }
  }

  .acc-1{ --c:var(--u1); } .acc-2{ --c:var(--u2); } .acc-3{ --c:var(--u3); }
  .acc-4{ --c:var(--u4); } .acc-5{ --c:var(--u5); } .acc-6{ --c:var(--u6); }
  .acc-7{ --c:var(--u7); } .acc-8{ --c:var(--u8); } .acc-9{ --c:var(--u9); }

  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans TC", -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3{ font-family:"Bricolage Grotesque","Noto Sans TC",sans-serif; margin:0; }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace; }
  button{ font-family:inherit; }
  ::selection{ background:var(--accent); color:var(--on-accent); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .app-bar{
    padding:18px clamp(18px,4vw,30px) 16px;
    border-bottom:1px solid var(--line);
  }
  .app-bar-title{ font-size:1.05rem; font-weight:700; letter-spacing:.02em; }
  .app-bar-sub{ font-size:.78rem; color:var(--ink-faint); margin-top:2px; }

  .screen{
    max-width:920px;
    margin:0 auto;
    padding:26px clamp(18px,4vw,30px) 60px;
  }
  .screen-label{
    font-size:.7rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    color:var(--ink-faint); margin-bottom:16px;
  }

  .back-btn{
    display:inline-flex; align-items:center; gap:6px;
    background:none; border:none; cursor:pointer; padding:4px 0;
    color:var(--ink-soft); font-size:.85rem; font-weight:500;
    margin-bottom:16px;
  }
  .back-btn:hover{ color:var(--ink); }

  /* ── 單元選擇：印章磚 ── */
  .unit-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(216px,1fr));
    gap:12px;
  }
  .unit-tile{
    position:relative;
    background:var(--c);
    color:var(--on-accent);
    border-radius:14px;
    padding:16px 16px 14px;
    cursor:pointer;
    border:none;
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:22px;
    transition:transform .14s ease, box-shadow .14s ease;
  }
  .unit-tile:hover{ transform:translateY(-3px); box-shadow:0 12px 22px -12px rgba(0,0,0,.4); }
  .unit-tile-top{ display:flex; align-items:center; justify-content:space-between; }
  .unit-index{
    font-size:.72rem; font-weight:600; letter-spacing:.06em;
    border:1px solid var(--on-accent-soft);
    border-radius:999px;
    width:30px; height:30px;
    display:flex; align-items:center; justify-content:center;
  }
  .unit-stamp-mark{ font-size:.95rem; opacity:.85; }
  .unit-tile-body{ display:flex; flex-direction:column; gap:6px; }
  .unit-name{ font-family:"Bricolage Grotesque","Noto Sans TC",sans-serif; font-size:1.05rem; font-weight:700; }
  .unit-desc{ font-size:.78rem; color:var(--on-accent-soft); line-height:1.5; }
  .unit-tile-foot{
    display:flex; align-items:center; justify-content:space-between;
    padding-top:12px; border-top:1px dashed var(--on-accent-soft);
    font-size:.72rem; font-weight:600; letter-spacing:.03em;
  }

  /* ── 單字列表 ── */
  .word-header{
    border-radius:14px;
    padding:16px 18px;
    background:color-mix(in srgb, var(--c) 22%, var(--surface));
    margin-bottom:16px;
  }
  .word-header-name{ font-size:1.08rem; font-weight:700; font-family:"Bricolage Grotesque","Noto Sans TC",sans-serif; }
  .word-header-desc{ font-size:.8rem; color:var(--ink-soft); margin-top:4px; }
  .word-header-meta{ margin-top:10px; font-size:.74rem; color:var(--c); font-weight:600; }
  .word-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:10px;
  }
  .word-tile{
    background:color-mix(in srgb, var(--c) 10%, var(--surface));
    border-left:3px solid var(--c);
    border-radius:10px;
    padding:13px 15px;
    cursor:pointer;
    transition:transform .12s ease;
  }
  .word-tile:hover{ transform:translateY(-2px); }
  .word-tile-en{ font-family:"Bricolage Grotesque","Noto Sans TC",sans-serif; font-size:1.08rem; font-weight:700; }
  .word-tile-zh{ font-size:.83rem; color:var(--ink-soft); margin-top:3px; }

  /* ── 單字卡 ── */
  .card-wrap{ max-width:440px; margin:0 auto; }
  .progress-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:8px; font-size:.78rem; color:var(--ink-soft);
  }
  .progress-track{ height:4px; border-radius:2px; background:var(--surface-3); overflow:hidden; margin-bottom:20px; }
  .progress-fill{ height:100%; background:var(--c); border-radius:2px; transition:width .25s ease; }

  .card-scene{ perspective:1400px; margin-bottom:16px; }
  .card-flip{
    position:relative; width:100%; height:320px;
    transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.4,0,.2,1);
    cursor:pointer;
  }
  .card-scene.flipped .card-flip{ transform:rotateY(180deg); }
  @media (max-width:480px){ .card-flip{ height:360px; } }
  @media (prefers-reduced-motion:reduce){ .card-flip{ transition:none; } }

  .card-face{
    position:absolute; inset:0;
    border-radius:18px;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    padding:24px 26px;
    box-shadow:var(--shadow);
    display:flex; flex-direction:column;
  }
  .card-front{ background:var(--c); color:var(--on-accent); justify-content:space-between; }
  .card-front-top{ display:flex; align-items:center; justify-content:space-between; }
  .card-front-tag{
    font-size:.66rem; letter-spacing:.14em; font-weight:600;
    border:1px solid var(--on-accent-soft); border-radius:999px; padding:4px 10px;
  }
  .card-front-hint{ font-size:.7rem; color:var(--on-accent-soft); }
  .card-front-word{
    font-family:"Bricolage Grotesque","Noto Sans TC",sans-serif;
    font-size:clamp(1.7rem,7vw,2.5rem);
    font-weight:700; line-height:1.15;
  }
  .card-front-pos{ font-size:.8rem; color:var(--on-accent-soft); margin-bottom:6px; }
  .card-front-bottom{ font-size:.85rem; color:var(--on-accent-soft); }

  .card-back{
    background:var(--surface);
    border:1px solid var(--line);
    transform:rotateY(180deg);
    overflow-y:auto;
    gap:12px;
  }
  .card-back-toprow{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .card-back-word{ font-size:.76rem; font-weight:700; letter-spacing:.1em; color:var(--c); }
  .card-back-pos{ font-size:.76rem; color:var(--ink-faint); }
  .card-back-zh{ font-size:1.4rem; font-weight:700; }
  .card-back-block{ display:flex; flex-direction:column; gap:4px; }
  .card-back-label{
    font-size:.64rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint);
  }
  .card-back-text{ font-size:.86rem; color:var(--ink-soft); line-height:1.6; }
  .card-back-example{
    background:var(--surface-2); border-radius:10px; padding:12px 14px;
    font-size:.86rem; color:var(--ink); line-height:1.6;
    border-left:2px solid var(--c);
  }
  .card-back-example-trans{ font-size:.8rem; color:var(--ink-soft); margin-top:6px; line-height:1.55; }
  .tags{ display:flex; flex-wrap:wrap; gap:6px; }
  .tag{
    background:color-mix(in srgb, var(--c) 14%, var(--surface));
    border-radius:6px; padding:4px 10px; font-size:.78rem; color:var(--ink-soft);
  }

  .nav-row{ display:flex; gap:8px; margin-bottom:12px; }
  .nav-btn{
    flex:1; padding:12px; border-radius:10px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink-soft); font-size:.85rem; font-weight:600; cursor:pointer;
    transition:border-color .15s, color .15s;
  }
  .nav-btn:hover:not(:disabled){ border-color:var(--c); color:var(--ink); }
  .nav-btn:disabled{ opacity:.35; cursor:not-allowed; }
  .flip-btn{ flex:1.3; background:var(--c); color:var(--on-accent); border-color:transparent; }
  .flip-btn:hover{ opacity:.92; color:var(--on-accent); }

  .listen-btn{
    width:100%; padding:12px; border-radius:10px; border:1px dashed var(--line-strong);
    background:transparent; color:var(--ink-soft); font-size:.85rem; font-weight:600; cursor:pointer;
    margin-bottom:14px;
  }
  .listen-btn:hover{ border-color:var(--c); color:var(--c); }

  #youglish-section{
    display:none;
    border:1px solid var(--line); border-radius:12px; padding:16px;
  }
  .youglish-label{
    font-size:.66rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
    color:var(--ink-faint); margin-bottom:12px;
  }
</style>
</head>
<body>

<div class="app-bar">
  <div class="app-bar-title">英語韌性課</div>
  <div class="app-bar-sub">單字通關</div>
</div>

<!-- 1. 單元列表 -->
<div class="screen" id="unit-list">
  <h2 class="screen-label">選擇單元</h2>
  <div class="unit-grid" id="units-container"></div>
</div>

<!-- 2. 單字列表 -->
<div class="screen" id="word-list" style="display:none;">
  <button class="back-btn" onclick="showUnitList()">← 回到單元列表</button>
  <div class="word-header" id="wl-header"></div>
  <div class="word-grid" id="word-grid"></div>
</div>

<!-- 3. 單字卡 -->
<div class="screen" id="flashcard-view" style="display:none;">
  <button class="back-btn" onclick="showWordList()">← 回到單字列表</button>

  <div class="card-wrap">
    <div class="progress-row">
      <span id="progress-text"></span>
      <span id="unit-name-tag"></span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>

    <div class="card-scene" id="card-scene" onclick="flipCard()">
      <div class="card-flip" id="card-flip">
        <div class="card-face card-front">
          <div class="card-front-top">
            <span class="card-front-tag mono" id="card-tag"></span>
            <span class="card-front-hint">點擊翻面</span>
          </div>
          <div>
            <div class="card-front-pos" id="card-pos"></div>
            <div class="card-front-word" id="card-english"></div>
          </div>
          <div class="card-front-bottom" id="card-zh-hint"></div>
        </div>

        <div class="card-face card-back">
          <div class="card-back-toprow">
            <span class="card-back-word mono" id="back-english"></span>
            <span class="card-back-pos" id="back-pos"></span>
          </div>
          <span class="card-back-zh" id="back-chinese"></span>

          <div class="card-back-block" id="back-usage-wrap">
            <span class="card-back-label">使用時機</span>
            <p class="card-back-text" id="back-usage"></p>
          </div>

          <div class="card-back-block" id="back-example-wrap">
            <span class="card-back-label">例句</span>
            <p class="card-back-example" id="back-example"></p>
            <p class="card-back-example-trans" id="back-example-trans"></p>
          </div>

          <div class="card-back-block" id="back-related-wrap">
            <span class="card-back-label">相關詞</span>
            <div class="tags" id="back-related"></div>
          </div>

          <div class="card-back-block" id="back-collocations-wrap">
            <span class="card-back-label">常見搭配</span>
            <div class="tags" id="back-collocations"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="nav-row">
      <button class="nav-btn" id="prev-btn" onclick="prevCard()">← 上一張</button>
      <button class="nav-btn flip-btn" onclick="flipCard()">翻面</button>
      <button class="nav-btn" id="next-btn" onclick="nextCard()">下一張 →</button>
    </div>

    <button class="listen-btn" id="listen-btn" onclick="loadYouGlish()">🔊 聽真實發音（YouGlish）</button>

    <div id="youglish-section">
      <div class="youglish-label">真實發音 · YouGlish</div>
      <div id="yg-widget"></div>
    </div>
  </div>
</div>

let currentUnitIndex = 0;
let currentCardIndex = 0;
let isFlipped = false;

// ── YouGlish widget ──
let ygWidget = null;
let pendingWord = null;
let ygFallbackWords = [];
let ygFallbackIndex = 0;

function onYouglishAPIReady() {
  ygWidget = new YG.Widget('yg-widget', {
    width: 640,
    components: 92,
    autoStart: 0,
    events: {
      'onFetchDone': function(event) {
        if (event.totalResult === 0 && ygFallbackIndex < ygFallbackWords.length) {
          ygWidget.fetch(ygFallbackWords[ygFallbackIndex], 'english');
          ygFallbackIndex++;
        }
      }
    }
  });
  if (pendingWord) {
    ygFetchWithFallback(pendingWord);
    pendingWord = null;
  }
}

function ygFetchWithFallback(word) {
  ygFallbackWords = word.split(/\s+/).filter(w => w.length > 2);
  ygFallbackIndex = 0;
  ygWidget.fetch(word, 'english');
}

function loadYouGlish() {
  const word = UNITS[currentUnitIndex].words[currentCardIndex];
  document.getElementById('listen-btn').style.display = 'none';
  document.getElementById('youglish-section').style.display = 'block';
  if (ygWidget) {
    ygFetchWithFallback(word.english);
  } else {
    pendingWord = word.english;
  }
}

// ── 畫面切換 ──
function showUnitList() {
  document.getElementById('unit-list').style.display = 'block';
  document.getElementById('word-list').style.display = 'none';
  document.getElementById('flashcard-view').style.display = 'none';
}

function showWordList() {
  document.getElementById('unit-list').style.display = 'none';
  document.getElementById('word-list').style.display = 'block';
  document.getElementById('flashcard-view').style.display = 'none';
}

// ── 單元列表 ──
function renderUnitList() {
  const container = document.getElementById('units-container');
  container.innerHTML = '';
  UNITS.forEach((unit, i) => {
    const acc = (i % 9) + 1;
    const card = document.createElement('button');
    card.className = `unit-tile acc-${acc}`;
    card.innerHTML = `
      <div class="unit-tile-top">
        <span class="unit-index mono">${String(i + 1).padStart(2, '0')}</span>
        <span class="unit-stamp-mark">✦</span>
      </div>
      <div class="unit-tile-body">
        <div class="unit-name">${unit.name}</div>
        ${unit.description ? `<div class="unit-desc">${unit.description}</div>` : ''}
      </div>
      <div class="unit-tile-foot">
        <span>${unit.words.length} 個單字</span>
        <span>入境 →</span>
      </div>
    `;
    card.onclick = () => openUnit(i);
    container.appendChild(card);
  });
}

// ── 單字列表 ──
function openUnit(unitIndex) {
  currentUnitIndex = unitIndex;
  const unit = UNITS[unitIndex];
  const acc = (unitIndex % 9) + 1;

  const header = document.getElementById('wl-header');
  header.className = `word-header acc-${acc}`;
  header.innerHTML = `
    <div class="word-header-name">${unit.name}</div>
    ${unit.description ? `<div class="word-header-desc">${unit.description}</div>` : ''}
    <div class="word-header-meta">共 ${unit.words.length} 個單字</div>
  `;

  const grid = document.getElementById('word-grid');
  grid.innerHTML = '';
  unit.words.forEach((word, i) => {
    const tile = document.createElement('div');
    tile.className = `word-tile acc-${acc}`;
    tile.innerHTML = `
      <div class="word-tile-en">${word.english}</div>
      <div class="word-tile-zh">${word.chinese}</div>
    `;
    tile.onclick = () => openWord(i);
    grid.appendChild(tile);
  });

  showWordList();
}

// ── 單字卡 ──
function openWord(wordIndex) {
  currentCardIndex = wordIndex;
  document.getElementById('word-list').style.display = 'none';
  document.getElementById('flashcard-view').style.display = 'block';
  document.getElementById('unit-name-tag').textContent = UNITS[currentUnitIndex].name;
  renderCard();
}

function renderCard() {
  const unit = UNITS[currentUnitIndex];
  const word = unit.words[currentCardIndex];
  const total = unit.words.length;
  const acc = (currentUnitIndex % 9) + 1;

  document.getElementById('card-scene').className = `card-scene acc-${acc}`;
  isFlipped = false;

  // 重置 YouGlish
  document.getElementById('youglish-section').style.display = 'none';
  document.getElementById('listen-btn').style.display = 'block';

  // 正面
  document.getElementById('card-tag').textContent = `VOCAB · ${String(currentCardIndex + 1).padStart(2, '0')}`;
  document.getElementById('card-pos').textContent = word.part_of_speech ? `(${word.part_of_speech})` : '';
  document.getElementById('card-english').textContent = word.english;
  document.getElementById('card-zh-hint').textContent = word.chinese || '';

  // 背面
  document.getElementById('back-english').textContent = word.english.toUpperCase();
  document.getElementById('back-pos').textContent = word.part_of_speech ? `（${word.part_of_speech}）` : '';
  document.getElementById('back-chinese').textContent = word.chinese;

  const usageWrap = document.getElementById('back-usage-wrap');
  if (word.usage_context) {
    document.getElementById('back-usage').textContent = word.usage_context;
    usageWrap.style.display = 'flex';
  } else {
    usageWrap.style.display = 'none';
  }

  const exWrap = document.getElementById('back-example-wrap');
  if (word.example_sentence) {
    document.getElementById('back-example').textContent = word.example_sentence;
    document.getElementById('back-example-trans').textContent = word.example_translation || '';
    exWrap.style.display = 'flex';
  } else {
    exWrap.style.display = 'none';
  }

  const relatedWrap = document.getElementById('back-related-wrap');
  if (word.related_words && word.related_words.length > 0) {
    document.getElementById('back-related').innerHTML =
      word.related_words.map(w => `<span class="tag">${w}</span>`).join('');
    relatedWrap.style.display = 'flex';
  } else {
    relatedWrap.style.display = 'none';
  }

  const collocationsWrap = document.getElementById('back-collocations-wrap');
  if (word.collocations && word.collocations.length > 0) {
    document.getElementById('back-collocations').innerHTML =
      word.collocations.map(c => `<span class="tag">${c}</span>`).join('');
    collocationsWrap.style.display = 'flex';
  } else {
    collocationsWrap.style.display = 'none';
  }

  document.getElementById('progress-text').textContent = `${currentCardIndex + 1} / ${total}`;
  document.getElementById('progress-fill').style.width = `${((currentCardIndex + 1) / total) * 100}%`;

  document.getElementById('prev-btn').disabled = currentCardIndex === 0;
  const nextBtn = document.getElementById('next-btn');
  nextBtn.textContent = currentCardIndex === total - 1 ? '回到列表 ↩' : '下一張 →';
  nextBtn.disabled = false;
}

function flipCard() {
  isFlipped = !isFlipped;
  document.getElementById('card-scene').classList.toggle('flipped', isFlipped);
}

function prevCard() {
  if (currentCardIndex > 0) {
    currentCardIndex--;
    renderCard();
  }
}

function nextCard() {
  const total = UNITS[currentUnitIndex].words.length;
  if (currentCardIndex < total - 1) {
    currentCardIndex++;
    renderCard();
  } else {
    showWordList();
  }
}

// 鍵盤操作
document.addEventListener('keydown', e => {
  if (document.getElementById('flashcard-view').style.display !== 'block') return;
  if (e.key === 'ArrowLeft') prevCard();
  else if (e.key === 'ArrowRight') nextCard();
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipCard(); }
});

renderUnitList();
