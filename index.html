<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英語韌性課 單字卡</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #f7f2e4;
      --cream-dark: #ede6d0;
      --gold: #8b7a4a;
      --gold-light: #b3a070;
      --text: #2c2416;
      --text-mid: #6b5e3e;
      --text-muted: #a09070;
      --divider: #d4c8a0;
      --tag-bg: #e8e0c8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      background: #e8e0cc;
      color: var(--text);
      min-height: 100vh;
    }

    /* ── 版頭 ── */
    .header {
      background: #3a2e18;
      color: #f7f2e4;
      padding: 18px 24px;
    }
    .header-title {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.05em;
    }
    .header-sub {
      font-size: 0.78rem;
      color: var(--gold-light);
      margin-top: 2px;
    }

    /* ── 單元列表 ── */
    #unit-list {
      max-width: 680px;
      margin: 40px auto;
      padding: 0 20px;
    }
    #unit-list h2 {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 14px;
    }
    .unit-card {
      background: var(--cream);
      border-left: 4px solid var(--gold);
      border-radius: 10px;
      padding: 18px 22px;
      margin-bottom: 10px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 3px 3px 0 var(--cream-dark);
      transition: transform 0.12s, box-shadow 0.12s;
    }
    .unit-card:hover {
      transform: translateY(-2px);
      box-shadow: 4px 5px 0 var(--cream-dark);
    }
    .unit-card-name {
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--text);
    }
    .unit-card-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 3px;
    }
    .unit-card-count {
      font-size: 0.75rem;
      color: var(--gold);
      font-weight: 600;
      white-space: nowrap;
      margin-left: 16px;
    }

    /* ── 單字卡區 ── */
    #flashcard-view {
      display: none;
      max-width: 680px;
      margin: 32px auto;
      padding: 0 20px 60px;
    }

    .back-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 0;
      margin-bottom: 18px;
    }
    .back-btn:hover { color: var(--text); }

    .unit-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }
    .unit-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    /* 進度 */
    .progress-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .progress-text {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .progress-bar {
      height: 3px;
      background: var(--divider);
      border-radius: 2px;
      margin-bottom: 22px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--gold);
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    /* ── 翻卡 ── */
    .card-stack {
      position: relative;
      margin-bottom: 20px;
      cursor: pointer;
    }
    /* 堆疊紙張效果 */
    .card-stack::before {
      content: '';
      position: absolute;
      inset: 6px -4px -8px 4px;
      background: #ddd4b8;
      border-left: 4px solid #a09060;
      border-radius: 10px;
      z-index: 0;
    }
    .card-stack::after {
      content: '';
      position: absolute;
      inset: 3px -2px -4px 2px;
      background: #e8e0c4;
      border-left: 4px solid #a8986a;
      border-radius: 10px;
      z-index: 1;
    }
    .card-scene {
      width: 100%;
      height: 300px;
      perspective: 1200px;
      position: relative;
      z-index: 2;
    }
    @media (max-width: 500px) {
      .card-scene { height: 340px; }
    }
    .card-flipper {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card-stack.flipped .card-flipper {
      transform: rotateY(180deg);
    }
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: var(--cream);
      border-left: 5px solid var(--gold);
      border-radius: 10px;
      padding: 28px 30px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 12px rgba(60,40,0,0.10);
    }
    .card-back {
      transform: rotateY(180deg);
      overflow-y: auto;
    }

    /* VOCAB 標籤 */
    .vocab-badge {
      position: absolute;
      top: 0;
      right: 0;
      background: var(--gold);
      color: var(--cream);
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      padding: 5px 13px;
      border-radius: 0 10px 0 8px;
    }

    /* 正面 */
    .card-hint {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-align: right;
      margin-bottom: auto;
    }
    .front-pos {
      font-size: 0.78rem;
      color: var(--gold);
      margin-bottom: 6px;
    }
    .front-english {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 2.4rem;
      font-weight: normal;
      color: var(--text);
      line-height: 1.2;
      margin-bottom: 8px;
    }
    .front-hint-bottom {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: auto;
    }

    /* 背面 */
    .back-english {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.15rem;
      color: var(--text-mid);
      margin-bottom: 4px;
    }
    .back-usage {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 14px;
    }
    .card-divider {
      border: none;
      border-top: 1px solid var(--divider);
      margin-bottom: 14px;
    }
    .back-translation-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .back-pos {
      font-size: 0.85rem;
      color: var(--gold);
    }
    .back-chinese {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }
    .back-example-label {
      font-size: 0.82rem;
      color: var(--gold);
      font-weight: 600;
      margin-right: 4px;
    }
    .back-example {
      font-size: 0.87rem;
      color: var(--text);
      line-height: 1.65;
      margin-bottom: 5px;
    }
    .back-example-trans {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 12px;
    }
    .tags-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 5px;
      margin-top: 10px;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .tag {
      background: var(--tag-bg);
      border-radius: 5px;
      padding: 3px 9px;
      font-size: 0.76rem;
      color: var(--text-mid);
    }

    /* YouGlish 區塊 */
    #youglish-section {
      margin-top: 10px;
      background: var(--cream);
      border-left: 5px solid var(--gold);
      border-radius: 10px;
      padding: 18px 22px 22px;
      box-shadow: 3px 3px 0 var(--cream-dark);
    }
    .youglish-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    /* 導航按鈕 */
    .nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .nav-btn {
      flex: 1;
      padding: 13px;
      border-radius: 8px;
      border: 2px solid var(--divider);
      background: var(--cream);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
      color: var(--text-mid);
    }
    .nav-btn:hover:not(:disabled) {
      border-color: var(--gold);
      background: var(--gold);
      color: var(--cream);
    }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .flip-btn {
      flex: 1.2;
      padding: 13px;
      border-radius: 8px;
      border: none;
      background: var(--gold);
      color: var(--cream);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .flip-btn:hover { background: #6e6038; }

    /* ── 聽發音按鈕 ── */
    .listen-btn {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: 2px dashed var(--divider);
      background: transparent;
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 16px;
      transition: border-color 0.15s, color 0.15s;
    }
    .listen-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    /* ── 單字列表 ── */
    #word-list {
      display: none;
      max-width: 680px;
      margin: 32px auto;
      padding: 0 20px 60px;
    }
    .word-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    @media (max-width: 400px) {
      .word-grid { grid-template-columns: 1fr; }
    }
    .word-tile {
      background: var(--cream);
      border-left: 4px solid var(--gold);
      border-radius: 10px;
      padding: 14px 16px;
      cursor: pointer;
      box-shadow: 2px 2px 0 var(--cream-dark);
      transition: transform 0.12s, box-shadow 0.12s;
    }
    .word-tile:hover {
      transform: translateY(-2px);
      box-shadow: 3px 4px 0 var(--cream-dark);
    }
    .word-tile-num {
      font-size: 0.62rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .word-tile-en {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.98rem;
      color: var(--text);
      margin-bottom: 3px;
      line-height: 1.3;
    }
    .word-tile-zh {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-title">英語韌性課</div>
  <div class="header-sub">單字卡練習</div>
</header>

<!-- 1. 單元列表 -->
<div id="unit-list">
  <h2>選擇單元</h2>
  <div id="units-container"></div>
</div>

<!-- 2. 單字列表 -->
<div id="word-list">
  <button class="back-btn" onclick="showUnitList()">← 回到單元列表</button>
  <div class="unit-title" id="wl-title"></div>
  <div class="unit-desc" id="wl-desc" style="margin-bottom:20px;"></div>
  <div class="word-grid" id="word-grid"></div>
</div>

<!-- 3. 單字卡 -->
<div id="flashcard-view">
  <button class="back-btn" onclick="showWordList()">← 回到單字列表</button>
  <div class="unit-title" id="view-unit-title"></div>

  <div class="progress-row">
    <span class="progress-text" id="progress-text"></span>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="progress-fill"></div>
  </div>

  <div class="card-stack" id="card-stack" onclick="flipCard()">
    <div class="card-scene">
      <div class="card-flipper" id="card-flipper">

        <div class="card-front">
          <div class="vocab-badge">V O C A B</div>
          <div class="card-hint">點擊翻面</div>
          <div class="front-pos" id="card-pos"></div>
          <div class="front-english" id="card-english"></div>
          <div class="front-hint-bottom" id="front-hint-bottom"></div>
        </div>

        <div class="card-back">
          <div class="vocab-badge">V O C A B</div>
          <div class="back-english" id="back-english"></div>
          <div class="back-usage" id="back-usage"></div>
          <hr class="card-divider">
          <div class="back-translation-row">
            <span class="back-pos" id="back-pos"></span>
            <span class="back-chinese" id="back-chinese"></span>
          </div>
          <div id="back-example-wrap">
            <div class="back-example">
              <span class="back-example-label">例：</span><span id="back-example"></span>
            </div>
            <div class="back-example-trans" id="back-example-trans"></div>
          </div>
          <div id="back-related-wrap">
            <div class="tags-label">相關詞</div>
            <div class="tags" id="back-related"></div>
          </div>
          <div id="back-collocations-wrap">
            <div class="tags-label">常見搭配</div>
            <div class="tags" id="back-collocations"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div class="nav-row">
    <button class="nav-btn" id="prev-btn" onclick="prevCard()">← 上一張</button>
    <button class="flip-btn" onclick="flipCard()">翻面</button>
    <button class="nav-btn" id="next-btn" onclick="nextCard()">下一張 →</button>
  </div>

  <button class="listen-btn" id="listen-btn" onclick="loadYouGlish()">▶ 聽真實發音（YouGlish）</button>

  <div id="youglish-section" style="display:none;">
    <div class="youglish-label">真實發音 · YouGlish</div>
    <div id="yg-widget"></div>
  </div>
</div>

let currentUnitIndex = 0;
let currentCardIndex = 0;
let isFlipped = false;

// ── YouGlish widget ──
let ygWidget = null;
let pendingWord = null;
let ygFallbackWords = [];
let ygFallbackIndex = 0;

function onYouglishAPIReady() {
  ygWidget = new YG.Widget('yg-widget', {
    width: 640,
    components: 92,
    autoStart: 0,
    events: {
      'onFetchDone': function(event) {
        if (event.totalResult === 0 && ygFallbackIndex < ygFallbackWords.length) {
          ygWidget.fetch(ygFallbackWords[ygFallbackIndex], 'english');
          ygFallbackIndex++;
        }
      }
    }
  });
  if (pendingWord) {
    ygFetchWithFallback(pendingWord);
    pendingWord = null;
  }
}

function ygFetchWithFallback(word) {
  ygFallbackWords = word.split(/\s+/).filter(w => w.length > 2);
  ygFallbackIndex = 0;
  ygWidget.fetch(word, 'english');
}

function loadYouGlish() {
  const word = UNITS[currentUnitIndex].words[currentCardIndex];
  document.getElementById('listen-btn').style.display = 'none';
  document.getElementById('youglish-section').style.display = 'block';
  if (ygWidget) {
    ygFetchWithFallback(word.english);
  } else {
    pendingWord = word.english;
  }
}

// ── 畫面切換 ──
function showUnitList() {
  document.getElementById('unit-list').style.display = 'block';
  document.getElementById('word-list').style.display = 'none';
  document.getElementById('flashcard-view').style.display = 'none';
}

function showWordList() {
  document.getElementById('unit-list').style.display = 'none';
  document.getElementById('word-list').style.display = 'block';
  document.getElementById('flashcard-view').style.display = 'none';
}

// ── 單元列表 ──
function renderUnitList() {
  const container = document.getElementById('units-container');
  container.innerHTML = '';
  UNITS.forEach((unit, i) => {
    const card = document.createElement('div');
    card.className = 'unit-card';
    card.innerHTML = `
      <div>
        <div class="unit-card-name">${unit.name}</div>
        ${unit.description ? `<div class="unit-card-desc">${unit.description}</div>` : ''}
      </div>
      <div class="unit-card-count">${unit.words.length} 個單字</div>
    `;
    card.onclick = () => openUnit(i);
    container.appendChild(card);
  });
}

// ── 單字列表 ──
function openUnit(unitIndex) {
  currentUnitIndex = unitIndex;
  const unit = UNITS[unitIndex];

  document.getElementById('wl-title').textContent = unit.name;
  document.getElementById('wl-desc').textContent = unit.description;

  const grid = document.getElementById('word-grid');
  grid.innerHTML = '';
  unit.words.forEach((word, i) => {
    const tile = document.createElement('div');
    tile.className = 'word-tile';
    tile.innerHTML = `
      <div class="word-tile-num">${i + 1}</div>
      <div class="word-tile-en">${word.english}</div>
      <div class="word-tile-zh">${word.chinese}</div>
    `;
    tile.onclick = () => openWord(i);
    grid.appendChild(tile);
  });

  document.getElementById('unit-list').style.display = 'none';
  document.getElementById('word-list').style.display = 'block';
}

// ── 單字卡 ──
function openWord(wordIndex) {
  currentCardIndex = wordIndex;
  document.getElementById('word-list').style.display = 'none';
  document.getElementById('flashcard-view').style.display = 'block';
  document.getElementById('view-unit-title').textContent = UNITS[currentUnitIndex].name;
  renderCard();
}

function renderCard() {
  const unit = UNITS[currentUnitIndex];
  const word = unit.words[currentCardIndex];
  const total = unit.words.length;

  isFlipped = false;
  document.getElementById('card-stack').classList.remove('flipped');

  // 重置 YouGlish
  document.getElementById('youglish-section').style.display = 'none';
  document.getElementById('listen-btn').style.display = 'block';

  // 正面
  document.getElementById('card-pos').textContent = word.part_of_speech ? `(${word.part_of_speech})` : '';
  document.getElementById('card-english').textContent = word.english;
  document.getElementById('front-hint-bottom').textContent = word.chinese || '';

  // 背面
  document.getElementById('back-english').textContent = word.english;
  document.getElementById('back-usage').textContent = word.usage_context;
  document.getElementById('back-pos').textContent = word.part_of_speech ? `（${word.part_of_speech}）` : '';
  document.getElementById('back-chinese').textContent = word.chinese;

  const exWrap = document.getElementById('back-example-wrap');
  if (word.example_sentence) {
    document.getElementById('back-example').textContent = word.example_sentence;
    document.getElementById('back-example-trans').textContent = word.example_translation;
    exWrap.style.display = 'block';
  } else {
    exWrap.style.display = 'none';
  }

  const relatedWrap = document.getElementById('back-related-wrap');
  if (word.related_words.length > 0) {
    document.getElementById('back-related').innerHTML =
      word.related_words.map(w => `<span class="tag">${w}</span>`).join('');
    relatedWrap.style.display = 'block';
  } else {
    relatedWrap.style.display = 'none';
  }

  const collocationsWrap = document.getElementById('back-collocations-wrap');
  if (word.collocations.length > 0) {
    document.getElementById('back-collocations').innerHTML =
      word.collocations.map(c => `<span class="tag">${c}</span>`).join('');
    collocationsWrap.style.display = 'block';
  } else {
    collocationsWrap.style.display = 'none';
  }

  document.getElementById('progress-text').textContent = `${currentCardIndex + 1} / ${total}`;
  document.getElementById('progress-fill').style.width = `${((currentCardIndex + 1) / total) * 100}%`;

  document.getElementById('prev-btn').disabled = currentCardIndex === 0;
  // 最後一張改成「回列表」
  const nextBtn = document.getElementById('next-btn');
  if (currentCardIndex === total - 1) {
    nextBtn.textContent = '回到列表 ↩';
    nextBtn.disabled = false;
  } else {
    nextBtn.textContent = '下一張 →';
    nextBtn.disabled = false;
  }
}

function flipCard() {
  isFlipped = !isFlipped;
  document.getElementById('card-stack').classList.toggle('flipped', isFlipped);
}

function prevCard() {
  if (currentCardIndex > 0) {
    currentCardIndex--;
    renderCard();
  }
}

function nextCard() {
  const total = UNITS[currentUnitIndex].words.length;
  if (currentCardIndex < total - 1) {
    currentCardIndex++;
    renderCard();
  } else {
    showWordList();
  }
}

// 鍵盤操作
document.addEventListener('keydown', e => {
  if (document.getElementById('flashcard-view').style.display !== 'block') return;
  if (e.key === 'ArrowLeft') prevCard();
  else if (e.key === 'ArrowRight') nextCard();
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipCard(); }
});

renderUnitList();
